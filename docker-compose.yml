#   ./docker-compose.yml

services:


    database:
        #   BANCO DE DADOS
        container_name: investimento_postgres
        image: postgres:17-bookworm
        restart: unless-stopped
        volumes:
          - postgres:/var/lib/postgresql/data
        env_file:
            - .env
        ports:
          - "5432:5432"
        networks:
            - investimento_network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 10s
            timeout: 5s
            retries: 5


    django:
        #   BACKEND
        container_name: investimento_django
        build: 
            context: ./django/
        restart: unless-stopped
        working_dir: /app
        command: /entrypoint.sh
        volumes:
          - ./django:/app
        env_file:
            - .env
        ports:
            - "8000:8000"
        networks:
            - investimento_network
        depends_on:
            database:
                condition: service_healthy


    pgadmin:
        #   VISUALIZAÇÃO DO BANCO DE DADOS
        container_name: investimento_pgadmin
        image: dpage/pgadmin4:9.16
        restart: unless-stopped
        volumes:
            - pgadmin:/var/lib/pgadmin
        env_file:
            - .env
        ports:
          - "5050:80"
        networks:
            - investimento_network
        depends_on:
            - database


networks:
    investimento_network:
        driver: bridge


volumes:
    postgres:
        driver: local
    pgadmin:
        driver: local